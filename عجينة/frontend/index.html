    <meta name="theme-color" content="#352017" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* The storefront and the dashboard are separate installable apps. One
         shared manifest made the dashboard install as the customer menu (or
         offer only "open in app" once the menu was installed), so /admin
         pages advertise their own before the browser evaluates it. */
      if (location.pathname.indexOf("/admin") === 0) {
        document.querySelector("link[rel=manifest]").setAttribute("href", "/admin.webmanifest")
      }
    </script>
    <meta name="application-name" content="عجينة وطحينة" />
