<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loli's — قريباً</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* ── Blobs ── */
.blob { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.b1 { width: 550px; height: 550px; background: radial-gradient(circle, #FFE0EF 0%, transparent 68%); top: -180px; right: -160px; animation: bpulse 9s ease-in-out infinite; }
.b2 { width: 450px; height: 450px; background: radial-gradient(circle, #FFF4CC 0%, transparent 68%); bottom: -130px; left: -130px; animation: bpulse 11s ease-in-out infinite reverse; }
.b3 { width: 280px; height: 280px; background: radial-gradient(circle, #FFDAEC 0%, transparent 68%); top: 45%; left: -80px; animation: bpulse 13s ease-in-out infinite 3s; }
@keyframes bpulse { 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.12);opacity:1} }

/* ── Floating stars ── */
.star {
  position: fixed; pointer-events: none; z-index: 0;
  animation: starFloat linear infinite;
  opacity: 0;
  color: #E8356D;
  font-size: 14px;
}
@keyframes starFloat {
  0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
  8%   { opacity: .3; }
  92%  { opacity: .3; }
  100% { transform: translateY(-10vh) rotate(540deg); opacity: 0; }
}

/* ── Page ── */
.page {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: 36px 24px 48px;
  max-width: 480px; width: 100%;
}

/* ── Logo image ── */
.logo-wrap {
  margin-bottom: 8px;
  animation: popIn .9s cubic-bezier(.34,1.56,.64,1) both;
  position: relative;
}
.logo-img {
  width: 220px;
  height: auto;
  filter: drop-shadow(0 16px 40px rgba(232,53,109,.22));
  animation: logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
@keyframes popIn {
  from { opacity:0; transform: scale(.7) translateY(-20px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}

/* ── Tagline ── */
.tagline {
  font-size: 13px;
  font-weight: 700;
  color: #C8A0B0;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 32px;
  animation: fadeUp .6s ease .25s both;
}

/* ── Pill badge ── */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: #FFF0F5;
  border: 1.5px solid #FFCCE0;
  color: #E8356D;
  font-size: 11px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 7px 18px; border-radius: 100px;
  margin-bottom: 20px;
  animation: fadeUp .6s ease .35s both;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #E8356D; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

/* ── Headline ── */
.headline {
  font-size: clamp(36px, 8vw, 58px);
  font-weight: 900;
  color: #1A060E;
  line-height: 1.2;
  margin-bottom: 14px;
  animation: fadeUp .7s ease .45s both;
}
.headline .pink {
  color: #E8356D;
  position: relative;
}
.headline .pink::after {
  content: '';
  position: absolute;
  bottom: 3px; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, #FFCB47, #E8356D);
  border-radius: 3px;
  opacity: .35;
}

/* ── Desc ── */
.desc {
  font-size: 15px;
  color: #A07888;
  line-height: 2;
  font-weight: 600;
  max-width: 380px;
  margin: 0 auto 32px;
  animation: fadeUp .7s ease .55s both;
}

/* ── Steps bar ── */
.steps {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 36px;
  animation: fadeUp .6s ease .6s both;
}
.step { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #D0B0BC; }
.step.done { color: #E8356D; }
.scircle { width: 28px; height: 28px; border-radius: 50%; background: #F8EEF2; border: 2px solid #F0D8E4; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.step.done .scircle { background: #E8356D; border-color: #E8356D; color: #fff; font-size: 11px; }
.sline { width: 28px; height: 2px; background: #F0D8E4; border-radius: 1px; }
.sline.done { background: linear-gradient(90deg, #E8356D, #FFAACF); }

/* ── Instagram button ── */
.ig-wrap {
  animation: fadeUp .8s cubic-bezier(.34,1.56,.64,1) .7s both;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.ig-handle-txt {
  font-size: 15px; font-weight: 700; color: #B090A0; letter-spacing: .5px;
  direction: ltr;
}
.ig-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  padding: 17px 40px;
  background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  border: none; border-radius: 100px;
  color: #fff; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 900;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 10px 32px rgba(220,39,67,.32);
  transition: transform .2s, box-shadow .2s;
}
.ig-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 48px rgba(220,39,67,.42); }
.ig-btn:active { transform: scale(.97); }
.ig-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

/* ── Footer ── */
.footer {
  position: fixed; bottom: 18px;
  font-size: 11px; color: #DEC8D0; font-weight: 600; letter-spacing: .5px;
  z-index: 1;
  animation: fadeUp .5s ease 1.2s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 440px) {
  .logo-img { width: 170px; }
  .headline { font-size: 32px; }
  .ig-card { padding: 20px; }
  .ig-handle { font-size: 17px; }
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<script>
['★','✦','✧','◇','✿'].forEach((s, i) => {
  for (let j = 0; j < 4; j++) {
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = s;
    el.style.right = (5 + Math.random() * 90) + '%';
    el.style.animationDuration = (13 + Math.random() * 10) + 's';
    el.style.animationDelay = (Math.random() * 14) + 's';
    el.style.fontSize = (10 + Math.random() * 14) + 'px';
    el.style.opacity = '0';
    document.body.appendChild(el);
  }
});
</script>

<main class="page">

  <!-- Logo image -->
  <div class="logo-wrap">
    <img src="frontend/public/logo.png" alt="Loli's Logo" class="logo-img" />
  </div>

  <div class="tagline">مطبخنا الأصيل</div>

  <!-- Badge -->
  <div class="pill">
    <div class="dot"></div>
    قريباً
    <div class="dot"></div>
  </div>

  <!-- Headline -->
  <h1 class="headline">
    <span class="pink">انتظرونا</span>
    <br>قريباً 🍽️
  </h1>

  <!-- Desc -->
  <p class="desc">
    شي رائع عم يتحضر بمطبخنا ✨<br>
    وصفات لذيذة وتجربة أجمل بتنطر إلكم!
  </p>

  <!-- Steps -->
  <div class="steps">
    <div class="step done">
      <div class="scircle">✓</div>
      <span>المطبخ</span>
    </div>
    <div class="sline done"></div>
    <div class="step done">
      <div class="scircle">✓</div>
      <span>الوصفات</span>
    </div>
    <div class="sline"></div>
    <div class="step">
      <div class="scircle">🚀</div>
      <span>الإطلاق</span>
    </div>
  </div>

  <!-- Instagram -->
  <div class="ig-wrap">
    <div class="ig-handle-txt">@loliz_taste</div>
    <a href="https://www.instagram.com/loliz_taste/" target="_blank" class="ig-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      تابعونا على الإنستغرام
    </a>
  </div>

</main>

<div class="footer">© 2025 Loli's Kitchen — كل الحقوق محفوظة</div>

</body>
</html>
